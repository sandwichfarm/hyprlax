[global]
fps = 144
duration = 4.0
vsync = false
easing = "expo"

[global.render]
tile = { x = true, y = false }
content_scale = 1.0

[global.parallax]
input = "workspace"
shift_percent = 5

[[global.layers]]
path = "./1.png"
shift_multiplier = 0.1
opacity = 1.0
blur = 0.0

[[global.layers]]
path = "./generated/sun-a.png"
shift_multiplier = 0.12
opacity = 0.0
blur = 0.4
fit = "cover"
overflow = "none"
tile = { x = false, y = false }

[[global.layers]]
path = "./generated/moon-a.png"
shift_multiplier = 0.14
opacity = 0.0
blur = 0.2
fit = "cover"
overflow = "none"
